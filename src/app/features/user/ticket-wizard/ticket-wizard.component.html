<!-- Navbar -->
<app-navbar></app-navbar>

<div class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-8">
    <h2 class="text-2xl font-bold text-center text-gray-900 mb-8">
      Obtenir un ticket
    </h2>


    <!-- Étape 1 : Nom -->
  <div *ngIf="step === 1" class="bg-white rounded-xl shadow p-8 w-full max-w-md">
    <h2 class="text-xl font-bold mb-2">Étape 1: Vos informations</h2>
    <p class="text-gray-600 mb-4">Votre nom complet est automatiquement rempli</p>
    <label class="block font-semibold mb-1">Nom complet</label>
    <input type="text" [(ngModel)]="fullName" readonly
      class="w-full border rounded px-3 py-2 mb-4 bg-gray-50"
      [value]="fullName">
    <button (click)="nextStep()" [disabled]="!fullName"
      class="w-full bg-blue-600 text-white py-2 rounded font-semibold hover:bg-blue-700 transition">
      Continuer
    </button>
  </div> 

    <!-- : Sélection de la ville -->
    <div *ngIf="currentStep === 1" class="space-y-6">
      <h3 class="text-lg font-medium text-gray-900">Sélectionnez votre ville</h3>
      <select 
        [(ngModel)]="selectedCity" 
        (change)="onCitySelect()"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
        <option value="">Choisir une ville</option>
        <option *ngFor="let city of cities" [value]="city.id">
          {{city.name}}
        </option>
      </select>
    </div>

    <!-- Étape 2: Sélection de l'agence -->
    <div *ngIf="currentStep === 2" class="space-y-6">
      <h3 class="text-lg font-medium text-gray-900">Sélectionnez votre agence</h3>
      <select 
        [(ngModel)]="selectedAgency" 
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
        <option value="">Choisir une agence</option>
        <option *ngFor="let agency of agencies" [value]="agency.id">
          {{agency.name}}
        </option>
      </select>
      <div class="flex justify-between">
        <button 
          (click)="previousStep()"
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-md">
          Retour
        </button>
        <button 
          (click)="createTicket()"
          [disabled]="!selectedAgency"
          class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-md disabled:opacity-50">
          Obtenir un ticket
        </button>
      </div>
    </div>

    <!-- Étape 3: Confirmation du ticket -->
    <div *ngIf="currentStep === 3" class="space-y-6">
      <div class="text-center">
        <h3 class="text-lg font-medium text-gray-900 mb-4">Ticket créé avec succès!</h3>
        <div class="bg-blue-50 p-4 rounded-lg">
          <p class="text-blue-800 font-medium">Numéro de ticket: {{ticketNumber}}</p>
          <p class="text-gray-600">Agence: {{selectedAgency?.name}}</p>
          <p class="text-gray-600">Personnes devant vous: {{peopleAhead}}</p>
        </div>
      </div>
      <button 
        (click)="finish()"
        class="w-full px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-md">
        Terminer
      </button>
    </div>
  </div>
</div>
<!-- Footer -->
<app-footer></app-footer>
