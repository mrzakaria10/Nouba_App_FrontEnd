<div class="max-w-2xl mx-auto py-8 px-4">
  <div class="bg-white rounded-lg shadow-lg p-6">
    <h1 class="text-2xl font-bold mb-6">Modifier l'Agence</h1>

    <!-- Loading state -->
    <div *ngIf="loading" class="text-center py-8">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
      <p class="mt-4 text-gray-600">Chargement en cours...</p>
    </div>

    <!-- Form -->
    <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nom de l'agence</label>
        <input type="text" formControlName="name"
               class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
               [class.border-red-500]="form.get('name')?.invalid && form.get('name')?.touched">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Photo</label>
        <div class="flex items-center space-x-4">
          <!-- Show new preview if selected, else show current photo from backend -->
          <img *ngIf="photoUrl; else oldPhoto" [src]="photoUrl" class="w-16 h-16 object-cover rounded" alt="Preview agency photo">
          <ng-template #oldPhoto>
            <img *ngIf="currentPhotoUrl" [src]="backendUrl + currentPhotoUrl" class="w-16 h-16 object-cover rounded" alt="Current agency photo">
          </ng-template>
          <input type="file" (change)="onPhotoChange($event)" accept="image/*"
                 class="flex-1 px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <p class="text-sm text-gray-500 mt-1">Laissez vide pour conserver la photo actuelle</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Adresse</label>
        <input type="text" formControlName="address"
               class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
               [class.border-red-500]="form.get('address')?.invalid && form.get('address')?.touched">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Téléphone</label>
        <input type="tel" formControlName="phone"
               class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
               [class.border-red-500]="form.get('phone')?.invalid && form.get('phone')?.touched">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Ville</label>
        <select formControlName="cityId"
                class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                [class.border-red-500]="form.get('cityId')?.invalid && form.get('cityId')?.touched">
          <option value="">Sélectionnez une ville</option>
          <option *ngFor="let city of cities" [value]="city.id">{{ city.name }}</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" formControlName="email"
               class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
               [class.border-red-500]="form.get('email')?.invalid && form.get('email')?.touched">
      </div>

      <div class="flex gap-4 pt-4">
        <button type="submit"
                class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
                [disabled]="form.invalid || loading">
          Enregistrer
        </button>
        <button type="button"
                class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400"
                (click)="router.navigate(['/admin/agencies'])">
          Annuler
        </button>
      </div>
    </form>
  </div>
</div>
