<!-- Conteneur principal du formulaire -->
<div class="max-w-2xl mx-auto py-8">
  <h1 class="text-3xl font-bold mb-6">Ajouter une Agence</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Nom</label>
      <input type="text" formControlName="name"
             class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
             [class.border-red-500]="form.get('name')?.invalid && form.get('name')?.touched">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Adresse</label>
      <input type="text" formControlName="address"
             class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
             [class.border-red-500]="form.get('address')?.invalid && form.get('address')?.touched">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Téléphone</label>
      <input type="tel" formControlName="phone"
             class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
             [class.border-red-500]="form.get('phone')?.invalid && form.get('phone')?.touched">
    </div>

    <div>
      <label for="cityId" class="block text-sm font-medium text-gray-700 mb-1">Ville</label>
      <select id="cityId" formControlName="cityId"
              class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              [class.border-red-500]="form.get('cityId')?.invalid && form.get('cityId')?.touched">
        <option value="">Sélectionnez une ville</option>
        <option *ngFor="let city of cities" [value]="city.id">{{ city.name }}</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" formControlName="email"
             class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
             [class.border-red-500]="form.get('email')?.invalid && form.get('email')?.touched">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
      <input type="password" formControlName="password"
             class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
             [class.border-red-500]="form.get('password')?.invalid && form.get('password')?.touched">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Photo</label>
      <input type="file" (change)="onPhotoChange($event)"
             class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div class="flex justify-end space-x-4">
      <button type="button" (click)="router.navigate(['/admin/agency-management'])"
              class="px-4 py-2 text-gray-600 hover:text-gray-800">
        Annuler
      </button>
      <button type="submit" [disabled]="form.invalid || loading"
              class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50">
        {{ loading ? 'Création...' : 'Créer' }}
      </button>
    </div>
  </form>
</div>
