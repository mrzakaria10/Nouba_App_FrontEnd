<div class="bg-white rounded-xl shadow p-6">
  <h2 class="text-lg font-bold mb-4">Clients de l'agence</h2>

  <div *ngIf="isLoading" class="text-center text-gray-500">Chargement...</div>
  <div *ngIf="errorMessage" class="text-center text-red-500">{{ errorMessage }}</div>

  <table *ngIf="!isLoading && !errorMessage" class="min-w-full text-sm text-left border-collapse">
    <thead>
      <tr class="border-b">
        <th class="py-2 px-3 text-gray-600 font-semibold">Nom</th>
        <th class="py-2 px-3 text-gray-600 font-semibold">Email</th>
        <th class="py-2 px-3 text-gray-600 font-semibold">Téléphone</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let client of clients" class="border-b hover:bg-gray-50">
        <td class="py-2 px-3">{{ client.name }}</td>
        <td class="py-2 px-3">{{ client.email }}</td>
        <td class="py-2 px-3">{{ client.phone }}</td>
      </tr>
    </tbody>
  </table>
</div>
