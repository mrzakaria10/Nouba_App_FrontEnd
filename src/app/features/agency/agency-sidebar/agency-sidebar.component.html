<aside class="h-screen bg-white border-r w-64 flex flex-col justify-between">
  <div>
    <!-- Logo & Agency Name -->
    <div class="flex items-center gap-3 px-6 py-5 border-b">
      <img src="assets/agency-logo.png" alt="Agency Logo" class="w-12 h-12 rounded-full object-cover" />
      <div>
        <div class="font-bold text-lg">Nouba Casablanca Centre</div>
        <div class="text-xs text-gray-500">123 Avenue Hassan II</div>
      </div>
    </div>
    <!-- Navigation -->
    <nav class="mt-4 flex-1">
      <ul class="space-y-1">
        <li>
          <a routerLink="/agency/dashboard" routerLinkActive="bg-blue-50 text-blue-700"
             class="flex items-center gap-2 px-6 py-2 rounded transition hover:bg-blue-50">
            <span class="material-icons text-blue-500">dashboard</span>
            <span>Tableau de bord</span>
          </a>
        </li>
        <li>
          <a routerLink="/agency/tickets" routerLinkActive="bg-blue-50 text-blue-700"
             class="flex items-center gap-2 px-6 py-2 rounded transition hover:bg-blue-50">
            <span class="material-icons text-blue-500">confirmation_number</span>
            <span>Tickets actifs</span>
          </a>
        </li>
        <li>
          <a routerLink="/agency/history" routerLinkActive="bg-blue-50 text-blue-700"
             class="flex items-center gap-2 px-6 py-2 rounded transition hover:bg-blue-50">
            <span class="material-icons text-blue-500">history</span>
            <span>Historique</span>
          </a>
        </li>
        <li>
          <a routerLink="/agency/clients" routerLinkActive="bg-blue-50 text-blue-700"
             class="flex items-center gap-2 px-6 py-2 rounded transition hover:bg-blue-50">
            <span class="material-icons text-blue-500">people</span>
            <span>Clients</span>
          </a>
        </li>
        <li>
          <a routerLink="/agency/admin" routerLinkActive="bg-blue-50 text-blue-700"
             class="flex items-center gap-2 px-6 py-2 rounded transition hover:bg-blue-50">
            <span class="material-icons text-blue-500">admin_panel_settings</span>
            <span>ADMIN</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
  <!-- Logout -->
  <div class="px-6 py-4 border-t">
    <button (click)="logout()"
      class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-red-50 text-red-600 rounded hover:bg-red-100 transition">
      <span class="material-icons">logout</span>
      <span>Déconnexion</span>
    </button>
  </div>
</aside>
