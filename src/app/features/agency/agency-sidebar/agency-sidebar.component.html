<nav class="bg-white border-r h-screen md:w-64 w-full flex flex-col justify-between fixed md:relative z-30">
  <div>
    <!-- Logo & Agency Name (dynamic) -->
    <div class="flex items-center gap-3 px-6 py-5 border-b">
      <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 12l9-9 9 9M4 10v10a1 1 0 001 1h3m10-11v10a1 1 0 01-1 1h-3m-6 0h6"/>
      </svg>
      <div>
        <div class="font-bold text-base md:text-lg">Espace Agence</div>
        <div class="text-xs text-gray-500">{{ agencyName }}</div>
      </div>
    </div>
    <!-- Navigation -->
    <ul class="mt-4 space-y-1">
      <li>
        <a routerLink="/agency/dashboard" routerLinkActive="bg-blue-50 text-blue-700"
           class="flex items-center gap-2 px-6 py-2 rounded transition hover:bg-blue-50">
          <!-- Dashboard SVG -->
          <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8v-10h-8v10zm0-18v6h8V3h-8z"/>
          </svg>
          <span>Tableau de bord</span>
        </a>
      </li>
      <li>
        <a routerLink="/agency/tickets" routerLinkActive="bg-blue-50 text-blue-700"
           class="flex items-center gap-2 px-6 py-2 rounded transition hover:bg-blue-50">
          <!-- Ticket SVG -->
          <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 7V5a2 2 0 012-2h12a2 2 0 012 2v2M4 7v10a2 2 0 002 2h12a2 2 0 002-2V7M4 7h16"/>
          </svg>
          <span>Tickets actifs</span>
        </a>
      </li>
      <li>
        <a routerLink="/agency/history" routerLinkActive="bg-blue-50 text-blue-700"
           class="flex items-center gap-2 px-6 py-2 rounded transition hover:bg-blue-50">
          <!-- History SVG -->
          <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>Historique</span>
        </a>
      </li>
      <li>
        <a routerLink="/agency/clients" routerLinkActive="bg-blue-50 text-blue-700"
           class="flex items-center gap-2 px-6 py-2 rounded transition hover:bg-blue-50">
          <!-- Clients SVG -->
          <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m9-4a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          <span>Clients</span>
        </a>
      </li>
    </ul>
  </div>
  <!-- Logout -->
  <div class="px-6 py-4 border-t">
    <button (click)="logout()"
      class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-red-50 text-red-600 rounded hover:bg-red-100 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H7a2 2 0 01-2-2V7a2 2 0 012-2h4a2 2 0 012 2v1"/>
      </svg>
      <span>Déconnexion</span>
    </button>
  </div>
</nav>
