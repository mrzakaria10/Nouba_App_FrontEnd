<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
      <div class="text-center">
        <div *ngIf="isActivating" class="flex flex-col items-center">
          <svg class="animate-spin h-12 w-12 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <p class="mt-4 text-gray-600">Activation du compte en cours...</p>
        </div>

        <div *ngIf="isSuccess" class="flex flex-col items-center">
          <svg class="h-12 w-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
          <h2 class="mt-4 text-2xl font-bold text-gray-900">Compte activé avec succès !</h2>
          <p class="mt-2 text-gray-600">Vous allez être redirigé vers la page de connexion...</p>
        </div>

        <div *ngIf="errorMessage" class="flex flex-col items-center">
          <svg class="h-12 w-12 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
          <h2 class="mt-4 text-2xl font-bold text-gray-900">Erreur d'activation</h2>
          <p class="mt-2 text-gray-600 text-center">{{ errorMessage }}</p>
          <div class="mt-6 space-y-4">
            <button (click)="retryActivation()" 
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
              Réessayer l'activation
            </button>
            <a [routerLink]="['/auth/login']" class="block text-center text-blue-600 hover:text-blue-500">
              Retour à la connexion
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
