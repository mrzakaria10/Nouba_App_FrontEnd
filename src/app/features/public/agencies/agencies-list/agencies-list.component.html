<app-navbar></app-navbar>
<div class="max-w-7xl mx-auto py-8">
  <h1 class="text-3xl font-bold text-center mb-2">Nos Agences</h1>
  <p class="text-center text-gray-500 mb-8">
    Retrouvez toutes nos agences Nouba à travers le pays et choisissez celle la plus proche de chez vous.
  </p>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let agency of agencies" class="bg-white rounded-lg shadow p-4 flex flex-col">
      <img [src]="'http://localhost:8080/api/uploads/' + agency.photoUrl" alt="{{ agency.name }}" class="w-full h-40 object-cover rounded mb-4" />
      <h2 class="text-lg font-bold mb-1">{{ agency.name }}</h2>
      <div class="text-gray-500 mb-1">{{ agency.city.name }}</div>
      <div class="text-gray-600 text-sm mb-1">
        <span class="font-semibold">Adresse:</span> {{ agency.address }}
      </div>
      <div class="text-gray-600 text-sm mb-2">
        <span class="font-semibold">Téléphone:</span> {{ agency.phone }}
      </div>
      <button class="mt-auto bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition w-full">
        Obtenir un ticket en 2 clics
      </button>
    </div>
  </div>
</div>
<app-footer></app-footer>
