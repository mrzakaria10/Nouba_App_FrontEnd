<app-navbar></app-navbar>

<div class="faq-container max-w-3xl mx-auto py-10 px-4">
  <h1 class="text-4xl font-extrabold text-center mb-8 text-blue-700 drop-shadow">Questions Fréquemment Posées</h1>
  
  <div class="space-y-4">
    <div *ngFor="let item of faqItems; let i = index" class="faq-item bg-white rounded-xl shadow p-6 transition hover:scale-[1.02] duration-200">
      <div class="faq-question flex justify-between items-center cursor-pointer" (click)="toggleFaq(i)">
        <span class="text-lg font-semibold text-gray-800">{{ item.question }}</span>
        <svg 
          class="faq-icon transition-transform duration-300" 
          [class.open]="item.isOpen"
          [ngClass]="{'rotate-180': item.isOpen}"
          width="24" 
          height="24" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round"
        >
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <div class="faq-answer mt-3 text-gray-600 text-base leading-relaxed" *ngIf="item.isOpen">
        {{ item.answer }}
      </div>
    </div>
  </div>

  <div class="mt-10 text-center">
    <p class="text-gray-600 mb-4 text-lg">Vous n'avez pas trouvé votre réponse ?</p>
    <button 
      class="bg-blue-600 text-white px-8 py-3 rounded-lg font-semibold text-lg shadow hover:bg-blue-700 transition"
      (click)="goToContact()">
      Contactez-nous
    </button>
  </div>
</div>

<app-footer></app-footer>
