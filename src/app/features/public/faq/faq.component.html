<app-navbar></app-navbar>

<div class="faq-container">
  <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Questions Fréquemment Posées</h1>
  
  <div class="space-y-4">
    <div *ngFor="let item of faqItems; let i = index" class="faq-item">
      <div class="faq-question" (click)="toggleFaq(i)">
        <span>{{ item.question }}</span>
        <svg 
          class="faq-icon" 
          [class.open]="item.isOpen"
          width="24" 
          height="24" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round"
        >
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <div class="faq-answer" *ngIf="item.isOpen">
        {{ item.answer }}
      </div>
    </div>
  </div>

  <div class="mt-8 text-center">
    <p class="text-gray-600 mb-4">Vous n'avez pas trouvé votre réponse ?</p>
    <button class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors">
      Contactez-nous
    </button>
  </div>
</div>

<app-footer></app-footer>
