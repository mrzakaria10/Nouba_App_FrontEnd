    <h2 class="text-3xl font-bold text-center mb-10 mt-8">Vérifiez votre ticket</h2>
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
      <!-- Header -->
      <div class="bg-blue-100 px-8 py-5">
        <span class="text-blue-600 text-xl font-semibold">Statut de votre ticket</span>
      </div>
      <!-- Form -->
      <form class="flex flex-col sm:flex-row gap-3 px-6 py-6 bg-white">

    </div>
